<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Sarvam FDE Prep</title>
<style>
  :root {

  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
  a { color: var(--accent); }
  header { padding: 18px 16px 0; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 12px; }
  nav { position: sticky; top: 0; background: var(--bg); z-index: 10; padding: 8px 12px; display: flex; gap: 6px; overflow-x: auto; max-width: 900px; margin: 0 auto; border-bottom: 1px solid var(--border); -webkit-overflow-scrolling: touch; }
  nav button { flex: 0 0 auto; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  section.tab { display: none; }
  section.tab.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .block { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .block.done { border-color: var(--done); background: var(--done-soft); }
  .block summary { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; list-style: none; }
  .block summary::-webkit-details-marker { display: none; }
  .block .time { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 84px; }
  .block .btitle { font-weight: 600; font-size: 0.95rem; flex: 1; }
  .block input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--done); cursor: pointer; flex-shrink: 0; }
  .block .body { padding: 0 14px 14px 14px; border-top: 1px solid var(--border); font-size: 0.92rem; }
  .block .body ul, .block .body ol { padding-left: 20px; margin: 10px 0; }
  .block .body li { margin-bottom: 7px; }
  .goal { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 0.88rem; margin: 10px 0 4px; }
  .goal b { color: var(--accent); }
  .donewhen { border-left: 3px solid var(--done); background: var(--done-soft); border-radius: 0 8px 8px 0; padding: 8px 12px; font-size: 0.88rem; margin-top: 10px; }
  .donewhen b { color: var(--done); }
  .rsrc { border-top: 1px dashed var(--border); margin-top: 10px; padding-top: 8px; }
  .rsrc .rh { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .progress-wrap { margin: 4px 0 16px; }
  .progress-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  .progress { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--done); width: 0%; transition: width .3s; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: .04em; }
  .scroll { overflow-x: auto; }
  h2 { font-size: 1.05rem; margin: 20px 0 8px; }
  h3 { font-size: 0.95rem; margin: 14px 0 6px; }
  .tag { font-size: 0.72rem; color: var(--muted); }
  .kbd { background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; font-size: .85em; }
  .note { color: var(--muted); font-size: 0.85rem; }
  ul.tight { padding-left: 20px; margin: 6px 0; } ul.tight li { margin-bottom: 5px; }
  .reset { border: 1px solid var(--border); background: none; color: var(--muted); border-radius: 6px; padding: 4px 10px; font-size: .78rem; cursor: pointer; }
  .round { display:inline-block; font-size:.72rem; font-weight:700; background:var(--accent); color:#fff; border-radius:6px; padding:1px 7px; margin-right:4px; }
</style>
</head>

  { t:"08:30–09:00", title:"Setup — environment + API key", html:`

  { t:"13:45–14:45", title:"Framework breadth pass — map, don't master", html:`

      <li>Memorize the one-liner for "is RAG dead?": <i>"RAG is now the retrieval subsystem of context engineering — hybrid search + reranking still wins on cost, latency, and freshness at enterprise corpus sizes."</i></li>
    </ol>
    <div class="rsrc"><div class="rh">Optional</div><ul><li><a href="https://ragflow.io/blog/rag-review-2025-from-rag-to-context" target="_blank">RAGFlow — From RAG to Context</a> <span class="tag">40m · state-of-field synthesis</span></li></ul></div>
    <div class="donewhen"><b>Done when:</b> you can give the 2026 RAG-vs-long-context answer with the numbers.</div>`},

  { t:"12:30–13:15", title:"Lunch", html:`<p class="note">Step away. Close the LangGraph gap from the warm-up if there was one.</p>`},

  { t:"13:15–16:15", title:"Build #1 — Sarvam-stack agent + eval harness (solo-typed)", html:`
    <div class="goal"><b><span class="round">R1</span>Goal:</b> a real, runnable thing on Sarvam's APIs with your evals playbook made concrete. Full brief in <span class="kbd">build-1/README.md</span>.</div>
    <p><b>▶ Doing this with Claude Code?</b> Follow the phase-by-phase roadmap with ready-made prompts: <a href="https://github.com/pansaryabbasali/FDE_prep/blob/claude/repo-write-access-0ls5dn/build-1/ROADMAP.md" target="_blank">build-1/ROADMAP.md</a> — open it in your Codespace and tell Claude Code: <span class="kbd">Read build-1/ROADMAP.md and follow it phase by phase; stop after each phase for my review.</span></p>
    <p><b>Option A (recommended) — BFSI call analytics</b> (mirrors their Samvaad business):</p>
    <ol>
      <li>Start from the cookbook's <span class="kbd">call-analytics</span> example (sample audio in <span class="kbd">sample_data/</span>).</li>
      <li>Transcribe with <b>Saaras v3</b> — run <span class="kbd">transcribe</span> and <span class="kbd">code-mixed</span> modes on the same file; diff the outputs (interview gold). Docs: <a href="https://docs.sarvam.ai/api-reference-docs/models/saaras" target="_blank">Saaras</a>.</li>
      <li>Pass the transcript to a Sarvam chat completion (OpenAI-compatible) extracting <b>intent, entities, summary as structured JSON</b> against a schema you define.</li>
      <li>Print a small per-call report.</li>
    </ol>
    <p><b>Option B — multilingual doc Q&amp;A</b>: Sarvam Vision async job (init → signed-URL upload → poll → download) → chunk → retrieve → cited answers.</p>
    <p><b>Non-negotiables:</b> ① JSON-schema structured output + retry-on-invalid path (gotcha: chat <span class="kbd">content</span> can be <span class="kbd">None</span> when reasoning eats the token budget) · ② eval harness: 10–15 hand-written cases + binary-rubric LLM-judge + pass-rate table · ③ commit to <span class="kbd">build-1/</span> and push.</p>
    <div class="rsrc"><div class="rh">Resources</div><ul>
      <li><a href="https://github.com/sarvamai/sarvam-ai-cookbook" target="_blank">cookbook</a> · <a href="https://github.com/sarvamai/skills" target="_blank">sarvamai/skills</a> (exact SDK signatures + gotchas) · <a href="https://docs.sarvam.ai/llms.txt" target="_blank">llms.txt</a></li>
    </ul></div>
    <div class="donewhen"><b>Done when:</b> one command processes real audio/docs end-to-end and prints an eval pass-rate table — every design choice defensible out loud.</div>`},

  { t:"16:15–16:45", title:"Break", html:`<p class="note">Real break before the timed drill.</p>`},

  { t:"16:45–17:30", title:"AI-assisted extension drill (timed 45 min)", html:`
    <div class="goal"><b><span class="round">R3</span>Goal:</b> first rehearsal of R3's actual skill — building <i>with</i> an AI assistant, fast, while staying in control. This is a different muscle from solo coding: spec → prompt → <b>verify</b> → iterate.</div>
    <p><b>▶ Full timed protocol</b> (extension options, the loop, retro template) is in the second half of <a href="https://github.com/pansaryabbasali/FDE_prep/blob/claude/repo-write-access-0ls5dn/build-1/ROADMAP.md" target="_blank">build-1/ROADMAP.md</a>.</p>
    <ol>
      <li>Choose an extension to Build #1, e.g.: add language-identification routing (route Hindi vs English calls to different prompts), or generate an HTML report page of all processed calls, or add a second judge and report agreement.</li>
      <li>Set a 45-min timer. Use an AI coding assistant — Copilot Chat in the Codespace, or a claude.ai/code session on your repo.</li>
      <li>Work the loop explicitly: write a 3-line spec first → prompt for one increment at a time → <b>read every diff critically before accepting</b> → run it → next increment.</li>
      <li>Rule: find at least one thing wrong or improvable in the AI's output (there always is one — a missed edge case, a hardcoded value, an ignored error path). Catching it out loud is exactly what R3 graders want to see.</li>
      <li>(5 min after) Retro in <span class="kbd">notes.md</span>: which prompt phrasing worked, where the AI wasted your time, what you'll do differently in the real R3.</li>
    </ol>
    <div class="donewhen"><b>Done when:</b> the feature works, you caught ≥1 AI mistake, and the retro is written.</div>`},

  { t:"17:30–18:15", title:"Tool use & structured outputs brush-up", html:`
    <div class="goal"><b>Goal:</b> sharpen the vocabulary behind what you just did by hand in Build #1.</div>
    <ol>
      <li>(25 min) <a href="https://www.anthropic.com/engineering/writing-tools-for-agents" target="_blank">Anthropic — "Writing effective tools for agents"</a>: high-leverage tool selection, namespacing, meaningful returns, token efficiency.</li>
      <li>(15 min) Skim <a href="https://platform.openai.com/docs/guides/function-calling" target="_blank">OpenAI function calling</a> + <a href="https://cookbook.openai.com/examples/structured_outputs_intro" target="_blank">structured outputs intro</a>: <span class="kbd">strict: true</span>, schema subset limits, refusal handling, parallel tool calls.</li>
      <li>(5 min) Name-drops for "how is valid JSON guaranteed on open models?": constrained decoding via Outlines / XGrammar / llguidance; <a href="https://arxiv.org/pdf/2501.10868" target="_blank">JSONSchemaBench</a>.</li>
    </ol>
    <div class="donewhen"><b>Done when:</b> you can explain the difference between JSON mode, function calling, and constrained decoding in under a minute.</div>`},

  { t:"18:15–18:45", title:"Flashcards + wrap", html:`
    <div class="goal"><b>Goal:</b> consolidate. Review today's flashcards; rewrite weak ones. Confirm Build #1 is pushed.</div>
    <div class="donewhen"><b>Done when:</b> reviewed and offline by 19:15.</div>`},
]},

{ id:"day3", label:"Day 3", title:"Day 3 (Sat) — Voice, Systems, Sarvam depth (~9.5 hrs)",
  intro:"Sarvam's business is voice-first conversational AI for BFSI (Samvaad ≈ 80% of revenue) — today builds the voice depth the resume lacks, plus the distributed-systems vocabulary and their stack, cold. All of it feeds R2 scenarios and R1 discussion.",
  blocks:[

  { t:"08:30–11:00", title:"Voice-agent architecture — top reading of the sprint", html:`
    <div class="goal"><b><span class="round">R2</span>Goal:</b> whiteboard-level fluency in real-time voice pipelines — the domain of their revenue product.</div>
    <ol>
      <li>(~2 h) Read <a href="https://voiceaiandvoiceagents.com/" target="_blank">"Voice AI &amp; Voice Agents: An Illustrated Primer"</a> (Daily/Pipecat team — THE canonical resource). Focus: latency budget, turn detection/VAD, interruption handling, telephony vs WebRTC, context management. If badly pressed: <a href="https://www.joeywang.blog/blog/voice-ai" target="_blank">condensed notes</a> (30 min).</li>
      <li>(25 min) <a href="https://livekit.com/blog/voice-agent-architecture-stt-llm-tts-pipelines-explained" target="_blank">LiveKit — voice agent architecture</a> — streaming/overlap mechanics with per-stage numbers.</li>
      <li>(20 min) <a href="https://softcery.com/lab/ai-voice-agents-real-time-vs-turn-based-tts-stt-architecture" target="_blank">Softcery — real-time vs turn-based 2026</a> — cascaded vs speech-to-speech vs hybrid, latency + cost.</li>
      <li><b>Memorize the latency budget cold</b> (write in notes.md, then recite):<br>
        • Target ~<b>800 ms</b> voice-to-voice; &lt;500 ms great, &gt;1.5 s broken.<br>
        • VAD 50–200 ms → streaming ASR partials 100–500 ms → LLM TTFT ~350 ms+ → TTS TTFA 75–200 ms → transport (WebRTC 30–50 ms; PSTN adds more).<br>
        • The trick is <b>overlap, not speed</b>.<br>
        • <b>Barge-in</b> = detect user speech during playback → stop TTS → cancel in-flight LLM → truncate context to what was actually heard.<br>
        • VAD (Silero) vs semantic turn-detection · telephony (SIP/PSTN, 8 kHz) vs WebRTC (16–48 kHz) · why Sarvam-30B (~2.4B active params) fits cheap low-latency voice.</li>
      <li>Closing drill: whiteboard the full streaming pipeline from memory with per-stage numbers; narrate barge-in end-to-end.</li>
    </ol>
    <div class="rsrc"><div class="rh">Optional</div><ul>
      <li><a href="https://github.com/pipecat-ai/pipecat" target="_blank">Pipecat</a> · <a href="https://webrtc.ventures/2026/03/choosing-a-voice-ai-agent-production-framework/" target="_blank">framework comparison</a> — Pipecat (Python pipeline control) vs LiveKit Agents (WebRTC/SIP native)</li>
    </ul></div>
    <div class="donewhen"><b>Done when:</b> the whiteboard drill works — full pipeline, numbers, barge-in narration, no notes.</div>`},

  { t:"11:00–13:00", title:"Build #2 — VAD from scratch + Sarvam voice loop", html:`
    <div class="goal"><b><span class="round">R1</span><span class="round">R3</span>Goal:</b> hands-on raw audio processing + their streaming speech APIs. Audio fluency also pays off if your R1/R3 problem is speech-flavored (likely at a voice company). Full brief in <span class="kbd">build-2/README.md</span>.</div>
    <p><b>Part 1 (~45 min) — VAD in numpy, no frameworks</b> → <span class="kbd">build-2/vad/</span>:</p>
    <ol>
      <li>Load a WAV with <span class="kbd">soundfile</span> (sample audio in the cookbook's <span class="kbd">sample_data/</span>).</li>
      <li>Frame it: 20–30 ms windows, 10 ms hop.</li>
      <li>Per frame: <b>short-time energy</b> + <b>zero-crossing rate</b>.</li>
      <li>Adaptive threshold from a noise-floor estimate (first ~100 ms) + <b>hangover smoothing</b>.</li>
      <li>Output speech segments with timestamps; compare against <span class="kbd">webrtcvad</span> on the same file.</li>
      <li>Fluency vocabulary: sample rate, frame size, hop length, SNR, hangover.</li>
    </ol>
    <p><b>Part 2 (~75 min) — minimal Sarvam voice loop</b> → <span class="kbd">build-2/agent/</span>:</p>
    <ol>
      <li>Reference: the <b>voice-agents skill</b> in <a href="https://github.com/sarvamai/skills" target="_blank">sarvamai/skills</a> or the cookbook streaming notebooks.</li>
      <li>WAV in → <b>Saaras v3 WebSocket streaming STT</b> → Sarvam-30B chat → <b>Bulbul v3 streaming TTS</b> → WAV out. Half-duplex is fine.</li>
      <li>No mic in a Codespace — file-to-file is correct; the learning is streaming APIs, WS lifecycle, audio formats, chunking.</li>
      <li>Fallback: run the cookbook's STT-streaming and TTS-streaming notebooks separately, glue file-to-file.</li>
    </ol>
    <div class="rsrc"><div class="rh">Resources</div><ul>
      <li><a href="https://docs.sarvam.ai/api-reference-docs/models/saaras" target="_blank">Saaras v3 docs</a> · <a href="https://docs.sarvam.ai/api-reference-docs/models/bulbul" target="_blank">Bulbul v3 docs</a> <span class="tag">(gotcha: v3 rejects pitch/loudness)</span></li>
    </ul></div>
    <div class="donewhen"><b>Done when:</b> your VAD roughly matches webrtcvad, and a WAV question in one end produces a spoken answer out the other. Both committed + pushed.</div>`},

  { t:"13:00–13:45", title:"Lunch", html:`<p class="note">Step away.</p>`},

  { t:"13:45–15:15", title:"Kafka, SQS, and reliability vocabulary", html:`
    <div class="goal"><b><span class="round">R2</span>Goal:</b> working vocabulary for the JD's "systems thinker … Kafka, SQS, or equivalent" — decision frameworks, not ops depth.</div>
    <ol>
      <li>(~45 min at 1.5x) <a href="https://www.youtube.com/watch?v=B7CwU_tNYIE" target="_blank">TechWorld with Nana — Kafka crash course</a>, or <a href="https://developer.confluent.io/courses/apache-kafka/events/" target="_blank">Confluent Kafka 101</a>. Must-know: topic · <b>partition</b> (ordering + parallelism unit) · broker · replication · producer acks · <b>consumer group</b> · offset · retention · log compaction.</li>
      <li>(15 min) ByteByteGo: <a href="https://blog.bytebytego.com/p/ep126-the-ultimate-kafka-101-you" target="_blank">Ultimate Kafka 101</a> + <a href="https://blog.bytebytego.com/p/why-is-kafka-fast" target="_blank">Why is Kafka fast?</a> (sequential I/O, zero-copy, batching).</li>
      <li>(15 min) Decision framework: <a href="https://www.svix.com/resources/faq/kafka-vs-sqs/" target="_blank">Kafka vs SQS</a> + <a href="https://techunfiltered.dev/sqs-vs-kafka-when-to-use-what-in-real-systems" target="_blank">when to use what</a>. SQS = managed task queue, competing consumers, no replay · Kafka = durable log, replay, fan-out, streaming · Azure mapping: Service Bus ↔ SQS, Event Hubs ↔ Kafka.</li>
      <li>(15 min) Reliability patterns: <a href="https://baxchain.com/blogs/resilient-event-driven-architecture-idempotency-retries-and-dead-letter-queues/" target="_blank">idempotency, retries, DLQs</a> — backoff + jitter + retry caps · poison → <b>DLQ</b> · <b>idempotency keys</b> (at-least-once ⇒ duplicates WILL happen) · circuit breakers · backpressure (429/503 + Retry-After).</li>
      <li>(10 min) Closing drill in <span class="kbd">notes.md</span>: design "WhatsApp bot for a bank — webhook → queue → agent workers → callback." Justify SQS vs Kafka; place the DLQ and the idempotency key.</li>
    </ol>
    <div class="rsrc"><div class="rh">Optional quick hits</div><ul>
      <li><a href="https://hookdeck.com/webhooks/guides/when-to-use-webhooks" target="_blank">Webhooks vs polling</a> · <a href="https://www.svix.com/resources/faq/webhooks-vs-api-polling/" target="_blank">Svix FAQ</a> · <a href="https://www.digitalapplied.com/blog/background-job-queue-patterns-2026-engineering-reference" target="_blank">background-job patterns 2026</a></li>
    </ul></div>
    <div class="donewhen"><b>Done when:</b> the WhatsApp-bot drill is written and every choice defensible.</div>`},

  { t:"15:15–16:15", title:"AI system design drills — two paper sketches", html:`
    <div class="goal"><b><span class="round">R2</span>Goal:</b> rehearse the two designs most likely to appear as R2 scenarios, timed, on paper — with business framing (cost, ROI, v1 scope), not just architecture.</div>
    <ol>
      <li>(40 min reading) <a href="https://huyenchip.com/2024/07/25/genai-platform.html" target="_blank">Chip Huyen — "Building A Generative AI Platform"</a> (RAG → gateway → caching → guardrails → router → observability), then skim <a href="https://www.systemdesignhandbook.com/guides/llm-system-design/" target="_blank">LLM System Design Guide 2026</a> (clarify use case/token budgets → orchestration → routing, fallbacks, cost control, failure modes).</li>
      <li>(10 min, timed) <b>Sketch 1 — LIC-scale multilingual voice policy servicing</b> (their real SBI Life shape: 80M customers, 11 languages): SIP ingress → code-mixed streaming STT → dialog agent with tool calls into core policy systems (read vs write paths; human handoff) → streaming TTS · queue between webhooks and workers · observability = transcripts + traces + eval sampling · on-prem/VPC variant · <b>cost model</b> (voice ~₹1/min — what dominates: LLM tokens vs ASR vs telephony?) · what's v1 and what's the ROI argument.</li>
      <li>(10 min, timed) <b>Sketch 2 — translation/dubbing pipeline for a media house</b>: demux → time-stamped ASR (anchor) → diarization → MT with <b>length/verbosity control</b> → TTS with <b>per-utterance duration fitting</b> → re-mux with original background · HITL QC · batch queues. Gotchas from the <a href="https://arxiv.org/pdf/2001.06785" target="_blank">Amazon dubbing paper</a>: prosodic alignment, isochrony, background preservation. Current ref: <a href="https://www.sportsvideo.org/2026/05/14/nvidia-releases-content-localization-blueprint-for-ai-assisted-dubbing-and-speech-translation/" target="_blank">NVIDIA localization blueprint</a>.</li>
    </ol>
    <div class="rsrc"><div class="rh">Optional deeper</div><ul>
      <li><a href="https://eugeneyan.com/writing/llm-patterns/" target="_blank">Eugene Yan — Patterns for LLM Systems</a> · <a href="https://applied-llms.org/" target="_blank">applied-llms.org</a></li>
    </ul></div>
    <div class="donewhen"><b>Done when:</b> both sketches exist with explicit v1 scope, failure modes, and a named cost driver.</div>`},

  { t:"16:15–16:45", title:"Break", html:`<p class="note">Walk.</p>`},

  { t:"16:45–17:45", title:"Sarvam memorization block", html:`
    <div class="goal"><b><span class="round">R1</span><span class="round">R4</span>Goal:</b> recite their stack cold — interviewers expect you to design with <i>their</i> models, and R1's "general discussion" will probe how much you know about them.</div>
    <ol>
      <li>Work through the <b>Cheat Sheet tab</b> top to bottom.</li>
      <li>Recite without looking: model lineup + what each is for · API surface · Samvaad / Arya / Indus · tokenizer-fertility story (~1.4–2.1 vs 4–8 tokens/word) · sovereignty narrative · partnerships (Tata Capital, SBI Life, LIC, IDFC First, CRED) · 2025–26 timeline.</li>
      <li>Self-quiz — answer with a specific model + mode: a Hinglish support call? (Saaras v3, code-mixed) · a 500-page Kannada PDF? (Sarvam Vision async jobs) · a low-latency voice agent? (Sarvam-30B + Bulbul v3 streaming) · translation preserving LaTeX? (Sarvam-Translate).</li>
      <li>(10 min) Skim primary sources so you've seen them: <a href="https://www.sarvam.ai/blogs/sarvam-30b-105b" target="_blank">30B/105B launch blog</a> · <a href="https://www.sarvam.ai/blogs/introducing-sarvam-arya" target="_blank">Arya announcement</a> · <a href="https://huggingface.co/sarvamai" target="_blank">their HF org</a>.</li>
    </ol>
    <div class="donewhen"><b>Done when:</b> all four self-quiz answers come out instantly and correctly.</div>`},

  { t:"17:45–18:30", title:"Code-reading drill #2", html:`
    <div class="goal"><b><span class="round">R1</span>Goal:</b> second reading rep, on harder material — real library code, not an example app.</div>
    <ol>
      <li>Pick a meatier target you haven't read: the <a href="https://github.com/sarvamai/sarvam-mcp" target="_blank">sarvam-mcp</a> server implementation, or a voice-agent pipeline in <a href="https://github.com/sarvamai/skills" target="_blank">sarvamai/skills</a>.</li>
      <li>(25 min) Same protocol as drill #1: top-down, narrating aloud — entry point → structure → API calls → error handling.</li>
      <li>(15 min) In <span class="kbd">notes.md</span>: what breaks first under load? what would you refactor? one bug/risk spotted. Bonus: anything you learned about Sarvam's API surface from reading their code.</li>
      <li>(5 min) 60-second summary aloud from memory.</li>
    </ol>
    <div class="donewhen"><b>Done when:</b> summary clean, answers written.</div>`},

  { t:"18:30–19:00", title:"Flashcards + wrap", html:`
    <div class="goal"><b>Goal:</b> consolidate. Review Days 1–3 flashcards; mark the shaky ones — Day 4's final pass targets those.</div>
    <div class="donewhen"><b>Done when:</b> reviewed; offline by 19:30. Tomorrow is rehearsal day — rest matters most tonight.</div>`},
]},

{ id:"day4", label:"Day 4", title:"Day 4 (Sun) — Full interview rehearsal: R1 → R2 → R3 → R4 (~8.5 hrs)",
  intro:"Rehearsal day, structured exactly like the confirmed loop. Everything timed, everything out loud. By tonight you'll have run every round at least once.",
  blocks:[

  { t:"09:00–10:00", title:"R1 rehearsal (a) — code read + write", html:`
    <div class="goal"><b><span class="round">R1</span>Goal:</b> warm and fast on both halves of the coding round.</div>
    <ol>
      <li>(30 min) 2–3 problems on <a href="https://neetcode.io/practice" target="_blank">NeetCode</a> — <b>arrays/hashing and two pointers only</b>. Skip everything else.</li>
      <li>(20 min) Timed code-reading: ask an LLM to "generate a 60-line Python function with subtle issues — mixed responsibilities, an off-by-one, a swallowed exception — and don't tell me what they are." You get 10 minutes to explain the code aloud and name the issues; then check.</li>
      <li>(10 min) One streaming exercise from memory: read a WAV in fixed-size chunks and compute a rolling RMS without loading the whole file.</li>
    </ol>
    <div class="donewhen"><b>Done when:</b> you caught most planted issues and the chunked-RMS runs.</div>`},

  { t:"10:00–11:00", title:"R1 rehearsal (b) — background, intent, impact", html:`
    <div class="goal"><b><span class="round">R1</span><span class="round">R4</span>Goal:</b> R1 explicitly covers "candidate background, intent, impact in previous role." Have all three crisp, with numbers.</div>
    <ol>
      <li>(20 min) Write the <b>2-minute career narrative</b>: Intel → Tiger → EY → IBM Client Engineering, told as an arc toward client-facing AI engineering. One impact number per role (RCA 1–3h → ~30min · retrieval 30–40min → &lt;1min · accuracy 82→93% · fraud pipeline in production).</li>
      <li>(15 min) Write the <b>"intent" answer</b> — why Sarvam, why FDE, why now. Use the Cheat Sheet's "Why Sarvam?" narrative as the base; make it yours. This is what "intent" in their R1 description means.</li>
      <li>(20 min) Rehearse both <b>aloud, twice</b>. Record yourself once on your phone and listen — painful but the fastest fix for rambling.</li>
      <li>(5 min) Prepare the one-line Sarvam hook: "I've already shipped Sarvam Document Intelligence inside a state-government engagement at IBM."</li>
    </ol>
    <div class="donewhen"><b>Done when:</b> both answers come out in ≤2 min each without notes, numbers included.</div>`},

  { t:"11:00–12:30", title:"R2 rehearsal — business case study mock #1", html:`
    <div class="goal"><b><span class="round">R2</span>Goal:</b> full-dress run of the business case study: business + technical scenarios, thinking evaluated out loud.</div>
    <ol>
      <li>(10 min) Re-read the decomp method: <a href="https://www.coditioning.com/blog/703/palantir-swe-decomposition-interview" target="_blank">decomposition guide</a>. Sequence: <b>ask questions before solving</b> → name entities/data flows → explicit v1 with justification → failure modes unprompted → think out loud continuously.</li>
      <li>(45 min, timed) Mock with an LLM interviewer (voice mode if available). Paste:<br><span class="kbd">You are an interviewer at an Indian AI company running a business case study round for a Forward Deployed Engineer. Give me one scenario mixing business and technical judgment (e.g., "a mid-size NBFC wants AI loan-collection calls in 8 languages — should they build it, and how?"). Push back with realistic constraints (compliance, legacy systems, latency, cost, ROI skepticism from the CFO) as I think out loud. Grade me on: questions asked, v1 scoping, business framing (cost/ROI/success metrics), and technical soundness.</span></li>
      <li>(15 min) Review the grade; write the top 2 fixes in <span class="kbd">notes.md</span>.</li>
      <li>(20 min) Patch the biggest weakness before mock #2 this afternoon (usually: forgetting the ROI/success-metric framing, or solutioning before questioning).</li>
    </ol>
    <div class="donewhen"><b>Done when:</b> mock complete, top-2 fixes written.</div>`},

  { t:"12:30–13:15", title:"Lunch", html:`<p class="note">Step away.</p>`},

  { t:"13:15–14:45", title:"R3 rehearsal — timed live build with AI (60 min + demo)", html:`
    <div class="goal"><b><span class="round">R3</span>Goal:</b> the full R3 simulation: unseen problem → small working app, built with AI help, then demoed. You practiced the loop Friday; today is the real-conditions rep.</div>
    <ol>
      <li>Get an unseen problem — ask an LLM: <span class="kbd">Give me one problem statement for a 60-minute live build: a small useful application for an Indian enterprise context, buildable with Python + LLM/speech APIs. Just the problem, no hints.</span> (Or pick blind: multilingual complaint classifier with a tiny UI · voice-note transcription + action-item extractor · circulars Q&amp;A bot with citations.)</li>
      <li>(60 min, hard timer) Build it with your AI assistant. Work the loop: 3-line spec → increment → <b>read the diff</b> → run → next. Use Sarvam APIs where natural. Ship something demoable over perfect — a running ugly app beats a beautiful fragment.</li>
      <li>Narrate decisions <b>aloud while building</b> — in the real R3 the interviewer is watching how you think and how you drive the AI, not just the result.</li>
      <li>(15 min) Demo it aloud as if to the interviewer: what it does → one design decision → one thing the AI got wrong and how you caught it → what you'd do with another hour.</li>

// ---------- Render ----------
const nav = document.getElementById('nav');
const main = document.getElementById('main');
const tabs = [...days, ...staticTabs];

function loadState(){ try { return JSON.parse(localStorage.getItem('fdeprep')||'{}'); } catch(e){ return {}; } }
function saveState(s){ localStorage.setItem('fdeprep', JSON.stringify(s)); }

tabs.forEach((t,i)=>{
  const b = document.createElement('button');
  b.textContent = t.label; b.dataset.tab = t.id;
  b.onclick = ()=>activate(t.id);
  nav.appendChild(b);

  const sec = document.createElement('section');
  sec.className = 'tab'; sec.id = 'tab-'+t.id;
  if (t.blocks) {
    sec.innerHTML = `<h2 style="margin-top:4px">${t.title}</h2><p class="note">${t.intro}</p>
      <div class="progress-wrap"><div class="progress-label" id="plabel-${t.id}"></div><div class="progress"><div id="pbar-${t.id}"></div></div></div>`;
    t.blocks.forEach((blk,j)=>{
      const key = t.id+'-'+j;
      const d = document.createElement('details');
      d.className = 'block'; d.id = 'blk-'+key;
      d.innerHTML = `<summary><input type="checkbox" data-key="${key}" onclick="event.stopPropagation()"><span class="time">${blk.t}</span><span class="btitle">${blk.title}</span></summary><div class="body">${blk.html}</div>`;
      sec.appendChild(d);
    });
  } else {
    sec.innerHTML = t.html;
  }
  main.appendChild(sec);
});

function refreshProgress(){
  const s = loadState();
  days.forEach(day=>{
    let done = 0;
    day.blocks.forEach((_,j)=>{
      const key = day.id+'-'+j;
      const cb = document.querySelector(`input[data-key="${key}"]`);
      const blk = document.getElementById('blk-'+key);
      const v = !!s[key];
      if (cb) cb.checked = v;
      if (blk) blk.classList.toggle('done', v);
      if (v) done++;
    });
    const total = day.blocks.length;
    document.getElementById('pbar-'+day.id).style.width = (100*done/total)+'%';
    document.getElementById('plabel-'+day.id).textContent = `${done} / ${total} blocks done`;
  });
}

main.addEventListener('change', e=>{
  if (e.target.matches('input[data-key]')) {
    const s = loadState();
    s[e.target.dataset.key] = e.target.checked;
    saveState(s); refreshProgress();
  }
});

function resetProgress(){
  if (confirm('Clear all checked blocks?')) { localStorage.removeItem('fdeprep'); refreshProgress(); }
}

function activate(id){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('section.tab').forEach(sec=>sec.classList.toggle('active', sec.id==='tab-'+id));
  localStorage.setItem('fdeprep-tab', id);
  window.scrollTo(0,0);
}

refreshProgress();
const savedTab = localStorage.getItem('fdeprep-tab');
activate(days.some(d=>d.id===savedTab) || staticTabs.some(t=>t.id===savedTab) ? savedTab : 'day1');
</script>
